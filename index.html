<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Bảo Mật Luau - Siêu Nén Cực Đại</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 40px; margin: 0; }
        .box { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 8px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        textarea { width: 95%; height: 150px; padding: 12px; margin: 10px 0; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 14px; resize: none; }
        button { background: #007bff; color: white; border: none; padding: 14px; cursor: pointer; border-radius: 4px; width: 100%; font-weight: bold; font-size: 16px; }
        button:hover { background: #0056b3; }
        .output { display: none; text-align: left; background: #1a1a1a; padding: 15px; margin-top: 20px; border-left: 4px solid #28a745; border-radius: 4px; }
        pre { background: #2d2d2d; padding: 12px; overflow-x: auto; color: #66ff66; font-size: 13px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
        #error-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #ff3333; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-family: monospace; z-index: 99999; }
        #error-screen h1 { font-size: 35px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐEN CHẶN NGƯỜI DÙNG THƯỜNG -->
    <div id="error-screen">
        <h1>HỆ THỐNG ĐÃ CHẶN TRUY CẬP!</h1>
        <p>Phát hiện truy cập trái phép bằng trình duyệt web thông thường.</p>
        <p>Vui lòng sử dụng Delta Exploit để thực thi mã nguồn này.</p>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div id="main-ui" class="box">
        <h2>Bộ Tạo Link Luau Nén Tỉ Lệ Cao</h2>
        <p style="color: #aaa; font-size: 13px;">Gom cụm mật độ dày - Tiết kiệm ký tự đường link tối đa</p>
        <textarea id="raw-code" placeholder="Dán script Luau gốc vào đây..."></textarea>
        <button onclick="generateMegaShortLink()">BẤM OK ĐỂ LẤY LINK NGẮN</button>

        <div id="result" class="output">
            <p style="color: #28a745; font-weight: bold;">✔ Kết quả siêu nén cho Delta:</p>
            <pre id="delta-string"></pre>
        </div>
    </div>

    <script>
        // Thuật toán dồn mảng ký tự mật độ lớn theo ý tưởng gom 25 chữ thành 1 cụm
        function megaCompress(str) {
            const buffer = new TextEncoder().encode(str);
            let binary = "";
            for (let i = 0; i < buffer.length; i++) {
                binary += String.fromCharCode(buffer[buffer[i] ? i : i]);
            }
            
            let base64 = btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            
            // Cơ chế quét dồn chuỗi lặp: Gom tất cả các chuỗi lặp liên tục lên tới 25-99 ký tự thành 1 mã rút gọn dạng *[Số lượng][Ký tự]
            return base64.replace(/(.)\1{2,99}/g, (match, char) => `*${match.length}${char}`);
        }

        function megaDecompress(str) {
            // Bung các cụm ký tự siêu nén lặp lại về dạng đầy đủ
            str = str.replace(/\*(\d+)(.)/g, (match, count, char) => char.repeat(parseInt(count, 10)));
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) str += '=';
            const binary = atob(str);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return new TextDecoder().decode(bytes);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const codeParam = urlParams.get('c');
        const userAgent = navigator.userAgent;
        const isRoblox = userAgent.includes("Roblox") || userAgent.includes("Delta") || userAgent.includes("Go-http-client");

        if (codeParam) {
            if (!isRoblox) {
                document.getElementById('main-ui').style.display = 'none';
                document.getElementById('error-screen').style.display = 'flex';
            } else {
                document.getElementById('main-ui').style.display = 'none';
                try {
                    const originalScript = megaDecompress(codeParam);
                    document.open();
                    document.write(originalScript);
                    document.close();
                } catch(e) {
                    document.open();
                    document.write("-- Loi giai ma chuoi sieu nen");
                    document.close();
                }
            }
        }

        function generateMegaShortLink() {
            const code = document.getElementById('raw-code').value.trim();
            if (!code) return alert("Vui lòng dán script vào!");

            // Thực thi ép cụm ký tự mật độ lớn
            const compressedData = megaCompress(code);
            
            const cleanUrl = window.location.href.split('?');
            const finalLink = `${cleanUrl}?c=${compressedData}`;
            
            document.getElementById('delta-string').innerText = `loadstring(game:HttpGet("${finalLink}"))()`;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
