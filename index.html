<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Bảo Mật Luau - Delta</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 40px; margin: 0; }
        .box { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 8px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        textarea { width: 95%; height: 150px; padding: 12px; margin: 10px 0; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 14px; resize: none; }
        button { background: #007bff; color: white; border: none; padding: 14px; cursor: pointer; border-radius: 4px; width: 100%; font-weight: bold; font-size: 16px; }
        button:hover { background: #0056b3; }
        .output { display: none; text-align: left; background: #1a1a1a; padding: 15px; margin-top: 20px; border-left: 4px solid #28a745; border-radius: 4px; }
        pre { background: #2d2d2d; padding: 12px; overflow-x: auto; color: #66ff66; font-size: 13px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
        #error-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #ff3333; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-family: monospace; z-index: 99999; }
        #error-screen h1 { font-size: 35px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH CHẶN NGƯỜI DÙNG THƯỜNG -->
    <div id="error-screen">
        <h1>HỆ THỐNG ĐÃ CHẶN TRUY CẬP!</h1>
        <p>Phát hiện truy cập trái phép bằng trình duyệt web thông thường.</p>
        <p>Vui lòng sử dụng Delta Exploit để thực thi mã nguồn này.</p>
    </div>

    <!-- GIAO DIỆN CHÍNH (GIỮ NGUYÊN Ô DÁN SCRIPT THEO Ý BẠN) -->
    <div id="main-ui" class="box">
        <h2>Bộ Tạo Link Luau Nén Siêu Gọn</h2>
        <p style="color: #aaa; font-size: 13px;">Dán script vào bấm OK để nhận link thu gọn, an toàn 100%</p>
        <textarea id="raw-code" placeholder="Dán script Luau gốc vào đây..."></textarea>
        <button onclick="generateCompressedLink()">BẤM OK ĐỂ LẤY LINK NGẮN</button>

        <div id="result" class="output">
            <p style="color: #28a745; font-weight: bold;">✔ Xong! Link Delta gọn gàng của bạn:</p>
            <pre id="delta-string"></pre>
        </div>
    </div>

    <script>
        // Sử dụng thuật toán nén chuỗi nội bộ bằng btoa kết hợp lọc mảng nhị phân
        function compressString(str) {
            const bytes = new TextEncoder().encode(str);
            let binString = "";
            for (let i = 0; i < bytes.length; i++) {
                binString += String.fromCharCode(bytes[i]);
            }
            return btoa(binString).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function decompressString(str) {
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) str += '=';
            const binString = atob(str);
            const bytes = new Uint8Array(binString.length);
            for (let i = 0; i < binString.length; i++) {
                bytes[i] = binString.charCodeAt(i);
            }
            return new TextDecoder().decode(bytes);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const hasCompressedData = urlParams.has('code');
        const userAgent = navigator.userAgent;
        const isRoblox = userAgent.includes("Roblox") || userAgent.includes("Delta") || userAgent.includes("Go-http-client");

        // XỬ LÝ KHI CLICK VÀO LINK / THỰC THI TRÊN DELTA
        if (hasCompressedData) {
            if (!isRoblox) {
                // Người thường vào bằng Chrome -> Chặn luôn
                document.getElementById('main-ui').style.display = 'none';
                document.getElementById('error-screen').style.display = 'flex';
            } else {
                // Delta gọi tới -> Giải nén âm thầm trả code thô cực nhanh
                document.getElementById('main-ui').style.display = 'none';
                try {
                    const rawData = urlParams.get('code');
                    const originalScript = decompressString(rawData);
                    document.open();
                    document.write(originalScript);
                    document.close();
                } catch(e) {
                    document.open();
                    document.write("-- Loi giai nen file script");
                    document.close();
                }
            }
        }

        // HÀM TẠO LINK KHI BẤM NÚT OK
        function generateCompressedLink() {
            const code = document.getElementById('raw-code').value.trim();
            if (!code) return alert("Vui lòng dán script vào ô trống!");

            // Gọi hàm nén nội bộ, dẹp bỏ hoàn toàn lỗi phình to ký tự tiếng Việt
            const compressed = compressString(code);
            
            const cleanUrl = window.location.href.split('?');
            const finalLink = `${cleanUrl}?code=${compressed}`;
            
            document.getElementById('delta-string').innerText = `loadstring(game:HttpGet("${finalLink}"))()`;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
